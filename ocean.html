<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Clear Lagoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  /* Full-bleed WebGL view under the same dark HUD chrome as SPH Liquid:
     a top bar of chips, a right-edge slide-out panel, nothing else. */
  :root {
    --bg: #0b0f14; --bar: #10161d; --line: #1e2a35; --chip: #16202b; --chip-line: #24333f;
    --well: #1c2733; --well-line: #2c3d4b; --fg: #cfd8e3; --muted: #8fa3b5; --faint: #6d7f8f;
    --accent: #7fd1ff; --on-accent: #0b0f14; --panel: rgba(13, 19, 26, 0.93); --good: #7fe08a; --bad: #ff9d6b;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
         padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px));
         padding-right: max(16px, env(safe-area-inset-right, 0px));
         background: var(--bar); border-bottom: 1px solid var(--line); }
  #bar b { color: var(--accent); }
  .chip { background: var(--chip); border: 1px solid var(--chip-line); border-radius: 6px;
          padding: 4px 9px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip span { color: var(--muted); }
  #hud-fps { min-width: 96px; text-align: right; }
  #hud-fps.good { color: var(--good); } #hud-fps.bad { color: var(--bad); }
  #hint { margin-left: auto; color: var(--faint); font-size: 12.5px; }
  #hint kbd { background: var(--well); border: 1px solid var(--well-line); border-radius: 4px;
              padding: 1px 5px; font-size: 11px; font-family: inherit; }
  #stage { position: relative; flex: 1; overflow: hidden; min-height: 0; }
  #cv { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #cv.looking { cursor: none; }
  .tbtn { background: var(--chip); border: 1px solid var(--chip-line); border-radius: 6px;
          color: var(--accent); padding: 3px 11px; font: inherit; cursor: pointer; }
  .tbtn:hover { background: var(--well); }
  .tbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .tbtn:focus-visible, #panel :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         padding: 24px; text-align: center; color: var(--muted); background: var(--bg); }
  #msg p { max-width: 34em; }
  #look-tip { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
              transform: translateX(-50%); background: rgba(11, 15, 20, 0.72); color: var(--fg);
              border: 1px solid var(--chip-line); border-radius: 6px; padding: 6px 12px;
              font-size: 13px; pointer-events: none; transition: opacity .4s; }
  /* ------------------------------------------------------- options panel */
  #panel { position: absolute; top: 0; right: 0; bottom: 0; width: 262px;
           background: var(--panel); border-left: 1px solid var(--line);
           padding: 12px calc(14px + env(safe-area-inset-right, 0px)) 20px 14px;
           overflow-y: auto; z-index: 5;
           transform: translateX(102%); transition: transform .16s ease; }
  #panel.open { transform: none; }
  #panel h3 { margin: 15px 0 5px; font-size: 11px; letter-spacing: .08em;
              text-transform: uppercase; color: var(--faint); font-weight: 600; }
  #panel h3:first-child { margin-top: 0; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 7px 0; }
  .prow label, .prow span { color: var(--muted); white-space: nowrap; }
  .prow output { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
  .prow input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .prow input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex: none; cursor: pointer; margin: 0;
    width: 40px; height: 23px; border-radius: 12px; position: relative;
    background: #24303e; border: 1px solid var(--well-line); transition: background .15s, border-color .15s;
  }
  .prow input[type="checkbox"]::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
    border-radius: 50%; background: var(--muted); transition: left .15s, background .15s;
  }
  .prow input[type="checkbox"]:checked { background: #1d5e8a; border-color: #2f7fb8; }
  .prow input[type="checkbox"]:checked::after { left: 19px; background: var(--accent); }
  .prow button { background: var(--well); color: #9fd1ff; border: 1px solid var(--well-line);
                 border-radius: 4px; padding: 2px 9px; font: inherit; cursor: pointer; }
  .prow button:hover { background: #24303e; }
  .prow select { background: var(--well); color: var(--fg); border: 1px solid var(--well-line);
                 border-radius: 4px; padding: 2px 5px; font: inherit; }
  #panel a { color: var(--accent); }
  #panel .note { color: var(--faint); font-size: 12px; margin: 4px 0 0; }
  @media (pointer: coarse) {
    body { font-size: 16px; }
    .chip { padding: 8px 12px; }
    .tbtn { padding: 8px 18px; font-size: 20px; min-height: 42px; }
    #hint { display: none; }
    #panel { width: 304px; font-size: 16px; }
    .prow { margin: 15px 0; gap: 12px; }
    .prow input[type="range"] { height: 36px; }
    .prow button, .prow select { min-height: 44px; font-size: 16px; padding: 8px 14px; }
    .prow input[type="checkbox"] { width: 52px; height: 30px; border-radius: 16px; }
    .prow input[type="checkbox"]::after { width: 24px; height: 24px; top: 3px; left: 3px; }
    .prow input[type="checkbox"]:checked::after { left: 24px; }
  }
  @media (max-width: 560px) { .chip.wide { display: none; } }
  @media (prefers-reduced-motion: reduce) { #panel, #look-tip { transition: none; } }
  body.fs #bar, body.fs #panel, body.fs #look-tip { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <b>Clear Lagoon</b>
    <div class="chip" id="hud-fps">-- fps</div>
    <div class="chip"><span>waves H<sub>s</sub></span> <span id="hud-hs">--</span></div>
    <div class="chip wide"><span>altitude</span> <span id="hud-alt">--</span></div>
    <div class="chip wide"><span>floor</span> <span id="hud-floor">--</span></div>
    <div class="chip wide"><span>paused</span> <span id="hud-pause">no</span></div>
    <button class="tbtn" id="ui-opts" title="options (H) — waves, water, sky, render">⚙</button>
    <button class="tbtn" id="ui-fs" title="full screen (F)">⛶</button>
    <div id="hint">
      <kbd>click</kbd> mouse look &nbsp; <kbd>WASD</kbd> move &nbsp; <kbd>Space</kbd>/<kbd>E</kbd> up &nbsp;
      <kbd>Q</kbd>/<kbd>C</kbd> down &nbsp; <kbd>Shift</kbd> fast &nbsp; <kbd>wheel</kbd> speed &nbsp;
      <kbd>P</kbd> pause &nbsp; <kbd>H</kbd> panel
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="look-tip">Drag to look around. Click for mouse look, WASD to fly.</div>
    <aside id="panel" aria-label="ocean settings"></aside>
    <div id="msg" hidden><p id="msg-text"></p></div>
  </div>
</div>

<script src="ocean.js?v=@@VER@@"></script>
<script>
"use strict";
// ===========================================================================
// Camera, input, settings panel and the frame loop. The ocean itself (waves,
// sky, floor, caustics) lives in ocean.js.
// ===========================================================================
(function () {
  var cv = document.getElementById("cv");
  var panel = document.getElementById("panel");
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;

  // ------------------------------------------------------- user options store
  var OPT_KEY = "lagoon-opts-1";
  function loadOpts() { try { return JSON.parse(localStorage.getItem(OPT_KEY)) || {}; } catch (e) { return {}; } }
  function saveOpts(o) { try { localStorage.setItem(OPT_KEY, JSON.stringify(o)); } catch (e) {} }
  var saved = loadOpts();
  var defaults = Object.assign({}, Ocean.DEFAULTS, coarse ? { renderScale: 0.7, meshDetail: 256 } : {});
  var params = Object.assign({}, defaults);
  Object.keys(saved).forEach(function (k) { if (k in params && typeof saved[k] === typeof params[k]) params[k] = saved[k]; });

  var renderer;
  try {
    renderer = new Ocean.Renderer(cv, params);
  } catch (e) {
    document.getElementById("msg-text").textContent = e.message + " Try a recent Chrome, Edge, Firefox or Safari.";
    document.getElementById("msg").hidden = false;
    console.error(e);
    return;
  }

  // ---------------------------------------------------------------- camera
  var HOME = { pos: [0, 4.2, 0], yaw: 0.35, pitch: -0.3 };
  var cam = { pos: HOME.pos.slice(), yaw: HOME.yaw, pitch: HOME.pitch, fov: 62 * Math.PI / 180, speed: 4 };
  if (typeof saved.camSpeed === "number") cam.speed = saved.camSpeed;
  if (typeof saved.fov === "number") cam.fov = saved.fov * Math.PI / 180;
  var cruise = !!saved.cruise;
  function fwd() {
    return [Math.cos(cam.pitch) * Math.cos(cam.yaw), Math.sin(cam.pitch), Math.cos(cam.pitch) * Math.sin(cam.yaw)];
  }
  function look(dx, dy) {
    cam.yaw += dx * 0.0032 * (cam.fov / 1.08);
    cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch - dy * 0.0032 * (cam.fov / 1.08)));
    hideTip();
  }

  // ------------------------------------------------------------- keyboard
  var keys = {};
  window.addEventListener("keydown", function (e) {
    // Form controls keep their own keys (arrows move sliders); clicking the
    // view hands the keyboard back to the camera.
    if (e.target && /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    keys[e.code] = true;
    if (k === "h" || k === "o") { togglePanel(); e.preventDefault(); }
    else if (k === "p") { setPaused(!paused); }
    else if (k === "f") { toggleFullscreen(); }
    else if (k === "r") { resetView(); }
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { keys = {}; });

  // --------------------------------------------- mouse: drag or pointer lock
  var drag = null, moved = 0;
  function locked() { return document.pointerLockElement === cv; }
  cv.addEventListener("pointerdown", function (e) {
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    if (e.pointerType === "touch") return;
    if (locked()) return;
    drag = { x: e.clientX, y: e.clientY }; moved = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener("pointermove", function (e) {
    if (e.pointerType === "touch") return;
    if (locked()) { look(e.movementX, e.movementY); return; }
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved += Math.abs(dx) + Math.abs(dy);
    drag.x = e.clientX; drag.y = e.clientY;
    look(-dx, -dy);              // grab the view, like a photo sphere
  });
  cv.addEventListener("pointerup", function (e) {
    if (e.pointerType === "touch" || !drag) return;
    var click = moved < 4;
    drag = null;
    // A click without a drag asks for mouse look; Esc gives the cursor back.
    if (click && cv.requestPointerLock) {
      try { var pr = cv.requestPointerLock(); if (pr && pr.catch) pr.catch(function () {}); } catch (err) {}
    }
  });
  document.addEventListener("pointerlockchange", function () { cv.classList.toggle("looking", locked()); });
  cv.addEventListener("wheel", function (e) {
    e.preventDefault();
    var d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    cam.speed = Math.max(0.5, Math.min(400, cam.speed * Math.exp(-d * 0.0015)));
    syncSpeed(); store();
  }, { passive: false });

  // ------------------------------------------- touch: one finger looks, two fly
  var touches = {};
  var pinch = null;
  function touchList() { return Object.keys(touches).map(function (k) { return touches[k]; }); }
  cv.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "touch") return;
    touches[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    pinch = null;
  });
  cv.addEventListener("pointermove", function (e) {
    if (e.pointerType !== "touch" || !touches[e.pointerId]) return;
    var t = touches[e.pointerId], dx = e.clientX - t.x, dy = e.clientY - t.y;
    t.x = e.clientX; t.y = e.clientY;
    var list = touchList();
    if (list.length === 1) { look(-dx * 1.2, -dy * 1.2); return; }
    if (list.length >= 2) {
      var a = list[0], b = list[1];
      var mid = [(a.x + b.x) / 2, (a.y + b.y) / 2], span = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) {
        // two-finger drag flies forward/back and sideways, pinch climbs or dives
        var s = cam.speed * 0.012;
        var fx = Math.cos(cam.yaw), fz = Math.sin(cam.yaw);
        var dmx = mid[0] - pinch.mid[0], dmy = mid[1] - pinch.mid[1];
        cam.pos[0] += (fx * dmy + fz * dmx) * s;
        cam.pos[2] += (fz * dmy - fx * dmx) * s;
        cam.pos[1] += (span - pinch.span) * s * 0.6;
      }
      pinch = { mid: mid, span: span };
      hideTip();
    }
  });
  function endTouch(e) { if (e.pointerType === "touch") { delete touches[e.pointerId]; pinch = null; } }
  cv.addEventListener("pointerup", endTouch);
  cv.addEventListener("pointercancel", endTouch);

  var tip = document.getElementById("look-tip"), tipShown = true;
  if (coarse) tip.textContent = "Drag to look. Two fingers: drag to fly, pinch to climb or dive.";
  function hideTip() { if (tipShown) { tipShown = false; tip.style.opacity = "0"; } }

  function resetView() {
    cam.pos = HOME.pos.slice(); cam.yaw = HOME.yaw; cam.pitch = HOME.pitch;
  }

  function moveCamera(dt) {
    var fast = keys.ShiftLeft || keys.ShiftRight ? 4 : 1;
    var v = cam.speed * fast * dt;
    var fx = Math.cos(cam.yaw), fz = Math.sin(cam.yaw), f = fwd();
    var mx = 0, my = 0, mz = 0;
    if (keys.KeyW || keys.ArrowUp) { mx += f[0]; my += f[1]; mz += f[2]; }
    if (keys.KeyS || keys.ArrowDown) { mx -= f[0]; my -= f[1]; mz -= f[2]; }
    if (keys.KeyD || keys.ArrowRight) { mx -= fz; mz += fx; }
    if (keys.KeyA || keys.ArrowLeft) { mx += fz; mz -= fx; }
    if (keys.Space || keys.KeyE) my += 1;
    if (keys.KeyQ || keys.KeyC) my -= 1;
    if (cruise) { mx += fx * 0.6; mz += fz * 0.6; }
    cam.pos[0] += mx * v; cam.pos[1] += my * v; cam.pos[2] += mz * v;
    if (mx || my || mz) hideTip();
    // keep the eye above the sand and below the clouds
    var floor = -renderer.floorDepthAt(cam.pos[0], cam.pos[2]) + 0.25;
    cam.pos[1] = Math.max(floor, Math.min(1400, cam.pos[1]));
  }

  // ------------------------------------------------------------ the panel
  // [key, label, min, max, step, unit, decimals, tooltip] or [section title]
  var CONTROLS = [
    ["Waves"],
    ["wind", "wind", 0.5, 20, 0.5, " m/s", 1, "wind speed at 10 m: raises wave height and period"],
    ["windDir", "wind heading", 0, 355, 5, "°", 0, "direction the waves travel toward"],
    ["fetch", "fetch", 1, 300, 1, " km", 0, "open water upwind: longer fetch, longer and bigger waves"],
    ["alignment", "alignment", 0.25, 4, 0.05, "×", 2, "how closely waves follow the wind (low = confused sea)"],
    ["chop", "choppiness", 0, 1.8, 0.05, "", 2, "sharpens crests by pulling the surface toward them"],
    ["foam", "foam", 0, 1, 0.05, "", 2, "whitecaps where crests fold over"],
    ["timeScale", "time", 0, 2, 0.05, "×", 2, "simulation speed"],
    ["Water"],
    ["depth", "depth", 1, 20, 0.5, " m", 1, "average depth of the sand floor"],
    ["relief", "floor relief", 0, 0.9, 0.05, "", 2, "sand bars and hollows: depth varies by ± this fraction"],
    ["clarity", "clarity", 0.3, 3, 0.05, "×", 2, "1 = clear tropical lagoon; lower is murkier"],
    ["caustics", "caustics", 0, 2, 0.05, "×", 2, "strength of the light network on the sand"],
    ["Sky"],
    ["sunElev", "sun height", 2, 89, 1, "°", 0, "sun elevation above the horizon"],
    ["sunAzim", "sun bearing", 0, 358, 2, "°", 0, "sun direction around the horizon"],
    ["clouds", "clouds", 0, 1, 0.05, "", 2, "cumulus cover"],
    ["Render"],
    ["exposure", "exposure", 0.1, 2, 0.01, "", 2, ""],
    ["renderScale", "resolution", 0.35, 1, 0.05, "×", 2, "fraction of screen pixels rendered; lower is faster"],
  ];
  var widgets = {};
  function fmt(c, v) { return (+v).toFixed(c[6]) + c[5]; }
  function row(html) { var d = document.createElement("div"); d.className = "prow"; d.innerHTML = html; panel.appendChild(d); return d; }
  CONTROLS.forEach(function (c) {
    if (c.length === 1) { var h = document.createElement("h3"); h.textContent = c[0]; panel.appendChild(h); return; }
    var id = "ui-" + c[0];
    var d = row('<label for="' + id + '"></label><input type="range" id="' + id + '"><output></output>');
    d.querySelector("label").textContent = c[1];
    var inp = d.querySelector("input"), out = d.querySelector("output");
    inp.min = c[2]; inp.max = c[3]; inp.step = c[4]; inp.title = c[7];
    inp.addEventListener("input", function () {
      var o = {}; o[c[0]] = +inp.value;
      renderer.setParams(o); params[c[0]] = +inp.value;
      out.textContent = fmt(c, inp.value); store();
    });
    widgets[c[0]] = { inp: inp, out: out, c: c };
  });
  var meshRow = row('<label for="ui-mesh">mesh detail</label><select id="ui-mesh" title="vertices per side of the water grid"><option>192</option><option>256</option><option>384</option><option>512</option></select>');
  var meshSel = meshRow.querySelector("select");
  meshSel.addEventListener("change", function () { params.meshDetail = +meshSel.value; renderer.setParams({ meshDetail: params.meshDetail }); store(); });
  var bloomRow = row('<label for="ui-bloom">sun glare</label><input type="checkbox" id="ui-bloom">');
  var bloomChk = bloomRow.querySelector("input");
  bloomChk.addEventListener("change", function () { params.bloom = bloomChk.checked; renderer.setParams({ bloom: params.bloom }); store(); });

  var h3 = document.createElement("h3"); h3.textContent = "Camera"; panel.appendChild(h3);
  var spRow = row('<label for="ui-speed">fly speed</label><input type="range" id="ui-speed" min="-0.7" max="2.6" step="0.01" title="the mouse wheel does this too"><output></output>');
  var spInp = spRow.querySelector("input"), spOut = spRow.querySelector("output");
  function syncSpeed() { spInp.value = Math.log10(cam.speed); spOut.textContent = (cam.speed < 10 ? cam.speed.toFixed(1) : Math.round(cam.speed)) + " m/s"; }
  spInp.addEventListener("input", function () { cam.speed = Math.pow(10, +spInp.value); syncSpeed(); store(); });
  var fovRow = row('<label for="ui-fov">field of view</label><input type="range" id="ui-fov" min="30" max="100" step="1"><output></output>');
  var fovInp = fovRow.querySelector("input"), fovOut = fovRow.querySelector("output");
  fovInp.addEventListener("input", function () { cam.fov = +fovInp.value * Math.PI / 180; fovOut.textContent = fovInp.value + "°"; store(); });
  var crRow = row('<label for="ui-cruise">cruise forward</label><input type="checkbox" id="ui-cruise" title="drift slowly along the view heading">');
  var crChk = crRow.querySelector("input");
  crChk.addEventListener("change", function () { cruise = crChk.checked; store(); });
  var btnRow = row('<button id="ui-home" type="button" title="back to the start point (R)">reset view</button><button id="ui-reset" type="button" title="restore every setting above">reset settings</button>');
  btnRow.querySelector("#ui-home").addEventListener("click", resetView);
  btnRow.querySelector("#ui-reset").addEventListener("click", function () {
    params = Object.assign({}, defaults);
    renderer.setParams(params);
    cam.speed = 4; cam.fov = 62 * Math.PI / 180; cruise = false;
    syncUI(); store();
  });
  var more = document.createElement("p"); more.className = "note";
  more.innerHTML = 'Waves: FFT ocean, JONSWAP spectrum. Floor seen through Snell refraction, lit by caustics from the same waves. <a href="index.html">2D SPH fluid →</a>';
  panel.appendChild(more);

  function syncUI() {
    Object.keys(widgets).forEach(function (k) {
      var w = widgets[k]; w.inp.value = params[k]; w.out.textContent = fmt(w.c, params[k]);
    });
    meshSel.value = String(params.meshDetail);
    bloomChk.checked = !!params.bloom;
    crChk.checked = cruise;
    fovInp.value = Math.round(cam.fov * 180 / Math.PI); fovOut.textContent = fovInp.value + "°";
    syncSpeed();
  }
  function store() {
    var o = {};
    Object.keys(params).forEach(function (k) { if (params[k] !== defaults[k]) o[k] = params[k]; });
    o.camSpeed = cam.speed; o.fov = Math.round(cam.fov * 180 / Math.PI); o.cruise = cruise;
    saveOpts(o);
  }
  syncUI();

  var optsBtn = document.getElementById("ui-opts");
  function togglePanel() { optsBtn.classList.toggle("on", panel.classList.toggle("open")); }
  optsBtn.addEventListener("click", togglePanel);

  // ------------------------------------------------------------ fullscreen
  var fsBtn = document.getElementById("ui-fs");
  function toggleFullscreen() {
    var d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    var el = d.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { try { var pr = req.call(el); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} }
  }
  function onFs() {
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fsBtn.classList.toggle("on", on);
    document.body.classList.toggle("fs", on);
  }
  document.addEventListener("fullscreenchange", onFs);
  document.addEventListener("webkitfullscreenchange", onFs);
  fsBtn.addEventListener("click", toggleFullscreen);

  // ------------------------------------------------------------------ HUD
  var paused = false;
  var hudFps = document.getElementById("hud-fps"), hudHs = document.getElementById("hud-hs");

  var hudPause = document.getElementById("hud-pause");

    hudTimer += dt;

      hudFps.textContent = Math.round(fpsEMA) + " fps";

      hudAlt.textContent = cam.pos[1].toFixed(1) + " m";
      hudFloor.textContent = renderer.floorDepthAt(cam.pos[0], cam.pos[2]).toFixed(1) + " m deep";
