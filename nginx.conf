types {
    application/manifest+json webmanifest;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # App shell: always revalidate, so a refreshed client picks up the new
    # sim immediately and the service worker can do its version dance.
    location ~* \.(html|js|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
